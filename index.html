<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语学习</title>
<!-- 防缓存：HTML/JS/CSS 不缓存，任何浏览器/代理每次重新拉取，杜绝"时好时坏" -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="css/style.css?v=9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英语学习">
<meta name="theme-color" content="#4f46e5">
</head>
<body>

<header id="topbar">
  <h1 class="logo"><img src="icons/logo-top.png" alt="英语学习" class="logo-img"> 英语学习</h1>
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="daily">每日学习</button>
    <button class="tab" data-tab="interest">感兴趣视频</button>
  </nav>
  <button id="btn-import" class="btn btn-primary">＋ 导入视频</button>
</header>

<main id="view-root"></main>

<div id="due-banner" hidden></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<footer id="footer">
  <span>英语学习 · 数据可云同步 · <span id="ver-tag">v0</span></span>
  <span class="footer-links">
    <a href="#" id="link-proxy" title="配置 Cloudflare Worker，在线版 B站站内播放">云代理</a>
    <a href="#" id="link-oss" title="配置阿里云 OSS，多设备数据同步（在线版可用）">云同步</a>
    <a href="#" id="link-sync" title="配置 WebDAV 网盘，跨设备同步数据">数据同步</a>
    <a href="#" id="link-export" title="下载数据备份文件">导出备份</a>
    <a href="#" id="link-import" title="从备份文件恢复数据">导入备份</a>
    <a href="#" id="link-force" title="强制更新：清除本地缓存并重新加载最新版">强制更新</a>
  </span>
</footer>

<input type="file" id="file-import" accept=".json" hidden>

<!-- 经典脚本，按依赖顺序加载（file 协议下 ES module 会被 CORS 拦截，故不用 module）
     APP_VERSION 用于开机自检：缓存里的旧代码会因版本不符被自动强刷 -->
<script src="js/storage.js?v=9"></script>
<script src="js/data.js?v=9"></script>
<script src="js/parse.js?v=9"></script>
<script src="js/bilibili.js?v=9"></script>
<script src="js/review.js?v=9"></script>
<script src="js/player.js?v=9"></script>
<script src="js/notes.js?v=9"></script>
<script src="js/sync.js?v=9"></script>
<script src="vendor/aliyun-oss-sdk.min.js"></script>
<script src="js/oss.js?v=9"></script>
<script src="js/ui.js?v=9"></script>
<script src="js/app.js?v=9"></script>
<script>
// 兜底自检：boot 正常会置 window.__APP_OK = true。8 秒内未就绪（= 旧缓存/坏代码）
// → 顶部显示黄色提示条（点击才刷新，弱网下不自动刷新，避免死循环成僵尸页）
(function () {
  setTimeout(function () {
    if (window.__APP_OK) return;
    var b = document.createElement('div');
    b.id = 'boot-fail-notice';
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#fef3c7;color:#92400e;padding:10px 16px;text-align:center;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);';
    b.innerHTML = '⚠️ 页面加载不完整，点击此处强制刷新';
    b.onclick = function () {
      if (window.caches) { caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }); }
      location.reload();
    };
    document.body.prepend(b);
  }, 8000);
})();
</script>
</body>
</html>
